name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to exact releases: not every action publishes a floating major tag.
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # Built against the *minimum* supported Python, so newer syntax cannot slip in.
        # `--locked` fails if uv.lock has drifted from pyproject.toml, rather than silently
        # resolving something different from what a developer gets locally.
        run: uv sync --locked --group docs --python 3.11

      # Ordered cheapest-first, so an obvious mistake fails in seconds.
      - name: Lint
        run: uv run ruff check

      - name: Type-check (strict)
        run: uv run ty check

      - name: Docs build with no broken links
        run: uv run mkdocs build --strict

      # `tests/` is an ATF suite describing ATF, so this is one run: the scenarios, and the
      # handful of Python tests for the parts no scenario can watch.
      # Three invocations rather than one, because they want different things. The Python tests are
      # ordinary tests and go across cores. The scenarios are an ATF suite and must not — the engine
      # is single-worker by design. The mutation guard runs the suite in subprocesses, so it shares a
      # machine with nobody. One `pytest -q` over the lot takes four times as long as the three.
      - name: Tests
        run: uv run pytest -q --ignore=tests/specs --ignore=tests/test_mutations.py -n auto

      - name: The scenarios
        run: uv run pytest -q tests/specs

      - name: The suite can still go red
        run: uv run pytest -q tests/test_mutations.py

      - name: The feature files are well formed
        run: uv run python -m atf.cli lint
        env:
          ATF_MANIFEST: tests/atf.yaml

      # Run the way a user would, which catches anything the harness papers over: scaffold a suite
      # with the command, then run it with nothing else set up. There is no example checked in — the
      # thing under test here is what a newcomer is actually handed.
      - name: What `atf init` writes must be green
        run: |
          mkdir -p "${RUNNER_TEMP}/scaffolded"
          cd "${RUNNER_TEMP}/scaffolded"
          uv run --project "${{ github.workspace }}" python -m atf.cli init
          ATF_ACTOR=scaffold uv run --project "${{ github.workspace }}" python -m pytest -q
