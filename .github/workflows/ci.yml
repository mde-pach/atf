name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to exact releases: not every action publishes a floating major tag.
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # Built against the *minimum* supported Python, so newer syntax cannot slip in.
        # `--locked` fails if uv.lock has drifted from pyproject.toml, rather than silently
        # resolving something different from what a developer gets locally.
        run: uv sync --locked --group docs --group browser --group mcp --python 3.11

      - name: Install chromium
        # The editor scenarios drive a real page. A system that does not answer is `unreachable`,
        # and unreachable fails the test that asked for it.
        run: uv run playwright install --with-deps chromium

      # Ordered cheapest-first, so an obvious mistake fails in seconds.
      - name: Lint
        run: uv run ruff check

      - name: Type-check (strict)
        run: uv run ty check

      # The two rules ruff cannot express: a module docstring is at most two lines, and no docstring
      # or comment argues why the code is this way. See README, conventions.
      - name: Docstrings and comments say what, not why
        run: uv run python scripts/prose.py

      - name: Docs build with no broken links
        run: uv run mkdocs build --strict

      # Every console block carrying `tesh-session` is run and its output compared. The command
      # reference's option lists are generated from the Click group, so they cannot drift at all.
      - name: The documentation's shell sessions still run
        run: uv run tesh docs/

      # No `--config` anywhere: `atf.yaml` is at the root of this repository, so the command finds
      # it the way it finds any project's.
      - name: The feature files are well formed
        run: uv run atf check

      # `tests/` is an ATF suite describing ATF, run the way a user runs one. Single-worker: the
      # engine is, and the suite serves an editor on one port.
      - name: The suite
        run: uv run atf run

      # Runs the suite twice over, so this comes after a plain run rather than replacing it.
      - name: The suite can still go red
        run: uv run python scripts/mutations.py

      # The examples are documentation that runs. A broken one is a broken page.
      - name: The examples
        run: |
          for example in examples/todo examples/rest; do
            (cd "${example}" && uv run --project "${{ github.workspace }}" atf run)
          done

      # Run the way a user would, which catches anything the harness papers over: scaffold a suite
      # with the command, then run it with nothing else set up. There is no example checked in — the
      # thing under test here is what a newcomer is actually handed.
      - name: What `atf init` writes must be green
        run: |
          mkdir -p "${RUNNER_TEMP}/scaffolded"
          cd "${RUNNER_TEMP}/scaffolded"
          uv run --project "${{ github.workspace }}" atf init
          uv run --project "${{ github.workspace }}" atf status local
          uv run --project "${{ github.workspace }}" atf run
