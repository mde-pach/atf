resources: [./tests/resources.py]
specs: ./tests/specs
extensions: [./tests/vocabulary.py]
default_env: local

environments:
  local:
    mutable: true
    filesystem: { root: ./.workspaces }
    shell:      { prefix: "uv run atf --config .workspaces/suite/atf.yaml", cwd: . }
    browser:    { base_url: "http://127.0.0.1:8791", headless: true }
