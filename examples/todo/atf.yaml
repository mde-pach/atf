resources: [./resources.py]
extensions: [./adapters/todo.py]
specs: ./specs
default_env: local

environments:
  local:
    mutable: true
    todo: { path: ./todo.db }
    sql:  { path: ./todo.db }
    shell: { prefix: "python todo.py" }

  # No `mutable`, so it is false. ATF reads this environment and changes nothing in it.
  readonly:
    todo: { path: ./todo.db }
    sql:  { path: ./todo.db }

  staging:
    todo: { path: ./staging.db }
    sql:  { path: ./staging.db }
