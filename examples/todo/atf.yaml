environments:
  local:
    owner: atf                    # ATF may make things here
    todo:  { path: ./todo.db }
    sql:   { path: ./todo.db }
    shell: { prefix: "python todo.py" }

  # ATF may only look here. Every thing in it becomes observed, whatever any one of them said.
  theirs:
    from:  local
    owner: them

  staging:
    from:  local
    todo:  { path: ./staging.db }
    sql:   { path: ./staging.db }
