# Resource types. Universal keys: system, mode, lifecycle, id_field.
# Everything else is adapter config.

owner:
  system: rest
  path: /owners
  natural_key: email

todo_list:
  system: rest
  path: /lists
  natural_key: [owner_id, slug]
  list_path: /owners/{owner_id}/lists      # scoped listing, so the lookup stays cheap

task:
  system: rest
  path: /tasks
  natural_key: [list_id, title]
  list_filter: [list_id]
  id_field: uuid                            # this endpoint returns identity under `uuid`
  # What can be *done* to a task, in the terms the `rest` adapter understands. A spec then says the
  # domain action — `When I complete the task "laundry"` — and no step code exists for either.
  actions:
    complete: { patch: { done: true } }
    reopen:   { patch: { done: false } }

label:
  system: reference                         # find-only: must already exist in the environment
  mode: reference
  path: /labels
  natural_key: name
  ref_field: slug

guest:
  system: guest                             # a custom adapter: multi-step, ephemeral, tears down
  lifecycle: ephemeral
  natural_key: nickname
