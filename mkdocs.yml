site_name: ATF
site_description: A test framework whose preconditions are declared as typed data rather than executed as setup.
repo_url: https://github.com/mde-pach/atf
repo_name: mde-pach/atf
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    logo: material/test-tube
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Ordinary collapsible sections: the sidebar lists the five modes and opens
    # only the one you are in. Not tabs — they hid too much — and not
    # `navigation.sections`, which forces every section open at once.
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  # Four hand-written pages, and nothing in them may depend on an essay. `scripts/prose.py` gates it.
  - Start: index.md
  - The model: model.md
  - Extending: extending.md

  # Generated. `scripts/reference.py` writes the sentences; mkdocs-click writes the commands.
  - Reference:
      - Sentences: reference/sentences.md
      - Commands: reference/commands.md

  # Optional depth, for somebody who has already used ATF.
  - Essays:
      - explanation/index.md
      - Declared, not executed: explanation/declared-not-executed.md
      - The surface and the library: explanation/the-surface-and-the-library.md
      - Why there is no state file: explanation/why-there-is-no-state-file.md
      - Every failure names your sentence: explanation/every-failure-names-your-sentence.md
      - The concept budget: explanation/the-concept-budget.md
      - What we borrowed: explanation/what-we-borrowed.md
      - Why the editor is plain: explanation/why-the-editor-is-plain.md

  - Explanation:
      - explanation/index.md
      - Declared, not executed: explanation/declared-not-executed.md
      - Why there is no state file: explanation/why-there-is-no-state-file.md
      - Every failure names your sentence: explanation/every-failure-names-your-sentence.md
      - What we borrowed: explanation/what-we-borrowed.md
      - Why the editor is plain: explanation/why-the-editor-is-plain.md
      - The concept budget: explanation/the-concept-budget.md

markdown_extensions:
  - admonition
  # The option lists in reference/the-command.md are rendered from the Click group itself, so
  # there is no second copy of a flag to go stale.
  - mkdocs-click
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables

exclude_docs: |
  _context/
  # Setup scripts for tesh, which must sit beside the page that names them.
  *.sh
