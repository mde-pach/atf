site_name: ATF
site_description: Another Test Framework — declarative resources, pluggable adapters, specs, and a cockpit.
site_url: https://mde-pach.github.io/atf/
repo_url: https://github.com/mde-pach/atf
repo_name: mde-pach/atf
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  icon:
    logo: material/test-tube
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

# The four Diátaxis sections, in the order a user meets them.
nav:
  - Home: index.md
  - Tutorial:
      - 1. Your first spec: tutorial/your-first-spec.md
      - 2. Point ATF at your own API: tutorial/point-atf-at-your-api.md
      - 3. Read your suite in the cockpit: tutorial/read-your-suite-in-the-cockpit.md
  - How-to guides:
      - Setting up:
          - Add a resource: how-to/add-a-resource.md
          - Add an adapter: how-to/add-an-adapter.md
          - Adopt ATF in an existing suite: how-to/adopt-atf-in-an-existing-suite.md
          - Run ATF in CI: how-to/run-atf-in-ci.md
      - Day to day:
          - Add a scenario: how-to/add-a-scenario.md
          - Keep the catalog in step with an API change: how-to/keep-the-catalog-in-step.md
      - When it breaks:
          - Find out why an environment is red: how-to/find-out-why-an-environment-is-red.md
          - Diagnose a failing provision: how-to/diagnose-a-failing-provision.md
  - Reference:
      - Manifest reference: reference/manifest.md
      - Catalog reference: reference/catalog.md
      - Providers reference: reference/providers.md
      - Phrasebook reference: reference/phrasebook.md
      - Specs and fixtures reference: reference/specs-and-fixtures.md
      - CLI reference: reference/cli.md
      - Cockpit reference: reference/cockpit.md
      - Adapter SPI reference: reference/adapter-spi.md
  - Explanation:
      - Glossary: explanation/glossary.md
      - Life of a run: explanation/life-of-a-run.md
      - About the model: explanation/the-model.md
      - About declarative catalogs: explanation/why-declarative-catalogs.md
      - About lifecycles: explanation/lifecycles.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # `mermaid` fences are handed to Material's bundled renderer instead of being highlighted.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# `mkdocs build --strict` (used in CI) turns these warnings into build failures.
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
    # Anchors are a published surface — the cockpit deep-links into the glossary.
    anchors: warn
  nav:
    omitted_files: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mde-pach/atf
