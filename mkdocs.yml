site_name: ATF
site_description: A test framework where what a test needs to exist is declared as typed data, and the graph comes with it.
repo_url: https://github.com/mde-pach/atf
repo_name: mde-pach/atf
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    logo: material/test-tube
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Collapsible sections: the sidebar lists the pages and opens the one you are in.
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  # One tutorial that ends green, then one page per thing somebody wants to do.
  - Start: index.md
  - Guides:
      - Arranging what a test needs: guides/arranging.md
      - Running it somewhere else: guides/environments.md
      - Leaving nothing behind: guides/cleanup.md
      - When it goes red: guides/failures.md
      - Running less of it: guides/choosing.md
      - Saying it in your own words: guides/words.md
      - Somewhere ATF has not heard of: guides/systems.md

  # Generated. `scripts/reference.py` writes the sentences; mkdocs-click writes the commands.
  - Reference:
      - Sentences: reference/sentences.md
      - Commands: reference/commands.md

markdown_extensions:
  - admonition
  # The option lists in reference/commands.md are rendered from the Click group itself, so
  # there is no second copy of a flag to go stale.
  - mkdocs-click
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  _context/
  # Setup scripts for tesh, which must sit beside the page that names them.
  *.sh
