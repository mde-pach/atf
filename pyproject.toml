[project]
name = "atf"
version = "0.1.0"
description = "Another Test Framework — resources declared as data, the graph that comes with them."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml",
    "httpx",
    "typing-extensions",
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    "pytest>=8",
    "pytest-json-report>=1.5",
    "python-multipart>=0.0.9",        # the editor's composer posts a form
]

[project.urls]
# The single place the project's own URL lives. `src/atf/` names no domain: the editor reads this
# from installed metadata.
Documentation = "https://mde-pach.github.io/atf/"
Source = "https://github.com/mde-pach/atf"

[project.scripts]
atf = "atf.entry:main"

# ATF is a pytest plugin, so a suite needs no `conftest.py` to enable it and no `pytest.ini` to be
# its own rootdir. Registered under its own module name, so `atf run`'s explicit `-p atf.plugin` is
# the same plugin and not a second registration of it.
#
# This loads in every pytest session on a machine that has ATF installed. `pytest_configure` finds
# no manifest in a project that is not an ATF suite and leaves the session entirely alone.
[project.entry-points.pytest11]
"atf.plugin" = "atf.plugin"

[dependency-groups]
dev = ["ruff", "ty"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-click>=0.9.0",
    "mkdocs-material>=9.5",
    "tesh>=0.3.2",
]
# What the `browser` system needs, and what ATF's own suite needs to run its editor scenarios:
#   uv sync --group browser && uv run playwright install chromium
browser = ["playwright>=1.40"]
# What a suite installs to let `atf edit --mcp` answer agents. A framework does not decide that
# every suite serves agents; the type check needs it, so this repository installs it.
mcp = ["mcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf"]

# The contract every system holds ships with ATF, because it is a feature file rather than a
# command: `atf run --contract` puts it in front of a suite's own scenarios.
[tool.hatch.build.targets.wheel.force-include]
"src/atf/contract.feature" = "atf/contract.feature"

[tool.ruff]
target-version = "py311"
line-length = 120
# The scaffolded suites `atf plan --apply` writes are somebody else's source, generated here.
exclude = [".workspaces"]
[tool.ruff.lint]
# `S105`-`S107` are flake8-bandit's hardcoded-credential rules and `PGH` is pygrep-hooks: no
# hardcoded credential, and no blanket `type: ignore`.
#
# Only the credential rules, not all of `S`. The rest of that family objects to `subprocess.run`
# without a shell check and to `markupsafe.Markup` — what ATF does for a living, and how its one
# template escapes.
select = ["E", "F", "I", "UP", "B", "SIM", "S105", "S106", "S107", "PGH", "D"]
# `D` is pydocstyle, and it is here for four rules: a docstring's summary is one line (`D200`), a
# body is separated from it by a blank one (`D205`), and it ends in a period (`D400`, `D415`).
#
# The missing-docstring rules are off. What a scope is worth saying is a judgement.
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # a docstring is worth having, or it is not
    "D203", "D213",                                                  # keep summary-on-first-line
    # A docstring here names what a thing *is* — "The fields of one resource, best-known first." A
    # mood rule would rewrite every one of those into a verb it does not have.
    "D401", "D403",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# A fixture that writes a password is writing a fixture; these rules are aimed at the framework.
# `D205` too: a test's docstring is the claim it makes, a body with no API summary in front of it.
"atf/**" = ["S105", "S106", "S107", "D205"]
# The templates `atf init` writes are strings here and source code in somebody else's project.
"src/atf/scaffold.py" = ["S105", "S106", "S107"]

[tool.ty.src]
include = ["src/atf"]
[tool.ty.environment]
python-version = "3.11"
[tool.ty.terminal]
error-on-warning = true
[tool.ty.rules]
missing-override-decorator = "error"
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["atf"]
