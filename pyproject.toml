[project]
name = "atf"
version = "0.1.0"
description = "Another Test Framework — declarative resources, pluggable adapters, specs, and a cockpit."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "httpx",
    "typing-extensions",
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",        # cockpit form posts (run-selected)
    "pytest>=8",
    "pytest-bdd>=8.1",
    "pytest-json-report>=1.5",
]

[project.urls]
# The single place the project's own URL lives: `src/atf/` must name no domain, so the cockpit
# reads this from installed metadata rather than hard-coding a link into a generic framework.
Documentation = "https://mde-pach.github.io/atf/"
Source = "https://github.com/mde-pach/atf"

[project.scripts]
atf = "atf.cli:main"

[dependency-groups]
# `faker` is here so the repo's own type check and tests can see it. It is *not* a dependency of
# `atf`: a framework should not decide what a project's test data looks like.
# `pytest-xdist` is for this repository's own suite and nothing else. ATF's engine is single-worker
# by design, so it never parallelises a *suite* — but ATF's own Python tests are ordinary tests with
# their own temp directories, and running those across cores takes them from four minutes to under
# one. See `tests/README.md`.
dev = ["ruff", "ty", "faker", "pytest-xdist"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
# Only `tests/` uses this, and only for the scenarios that need a page to have *run* rather
# than merely been served. Absent, those scenarios skip and everything else still passes:
#   uv sync --group browser && uv run playwright install chromium
browser = ["playwright>=1.40"]
# What a consuming project installs to use `${fake:…}`. ATF registers the provider only when the
# import succeeds, so a suite without it simply has one fewer provider.
fake = ["faker"]
# What a suite installs to let `atf serve --mcp` answer agents. Deliberately not a dependency of
# `atf` and deliberately not in `dev`: a framework should not decide that every suite serves agents,
# and this repository's own suite asserts what the command says when the SDK is absent — which it
# could not do if its own checks installed it.
mcp = ["mcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf"]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
# `S105`-`S107` are flake8-bandit's hardcoded-credential rules and `PGH` is pygrep-hooks. They are
# here because tests used to do their job by reading ATF's own source with a regular expression: one
# hunted `password = "…"`, another hunted `type: ignore`. A linter enforces a convention; a test
# suite proves behaviour, and those two were wearing each other's clothes.
#
# Only the credential rules, not all of `S`. The rest of that family objects to `subprocess.run`
# without a shell check and to `markupsafe.Markup` — which are, respectively, what ATF does for a
# living and how its one template escapes. Enabling them would buy six suppressions, and a
# suppression is the thing this convention exists to keep out.
select = ["E", "F", "I", "UP", "B", "SIM", "S105", "S106", "S107", "PGH", "D"]
# `D` is pydocstyle, and it is here for four rules: a docstring's summary is one line (`D200`), a
# body is separated from it by a blank one (`D205`), and it ends in a period (`D400`, `D415`). An
# essay can then no longer masquerade as a summary — it is visibly a body, in review.
#
# The missing-docstring rules are off. What a scope is worth saying is a judgement, and a linter that
# demands one everywhere is answered with `"""Do the thing."""` — which is the convention this repo
# holds to inverted.
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # a docstring is worth having, or it is not
    "D203", "D213",                                                  # keep summary-on-first-line
    # A docstring here names what a thing *is* — "The fields of one resource, best-known first." A
    # mood rule would rewrite every one of those into a verb it does not have.
    "D401", "D403",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# A fixture that writes a password is writing a fixture. These rules are aimed at the framework.
#
# `D205` too: a test's docstring is the claim the test makes, which is a body with no API summary in
# front of it. The rule is worth keeping over `src/atf`, where a summary is what a caller reads first.
"tests/**" = ["S105", "S106", "S107", "D205"]
# The templates `atf init` writes are strings here and source code in somebody else's project.
"src/atf/scaffold.py" = ["S105", "S106", "S107"]

[tool.ty.src]
include = ["src/atf"]
[tool.ty.environment]
python-version = "3.11"
[tool.ty.terminal]
error-on-warning = true
[tool.ty.rules]
missing-override-decorator = "error"
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs a real browser — skipped unless playwright and chromium are installed",
    # Applied to every scenario by `tests/specs/conftest.py`, so that `-n auto --dist loadgroup`
    # keeps them all on one worker. Registered here because the marker has to be known whether or
    # not pytest-xdist is installed.
    "xdist_group: run these on one worker — ATF's engine is single-worker by design",
]
