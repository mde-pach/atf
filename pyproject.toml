[project]
name = "atf"
version = "0.1.0"
description = "Another Test Framework — declarative resources, pluggable adapters, specs, and a cockpit."
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "httpx",
    "typing-extensions",
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",        # cockpit form posts (run-selected)
    "pytest>=8",
    "pytest-bdd>=8.1",
    "pytest-json-report>=1.5",
]

[project.urls]
# The single place the project's own URL lives: `src/atf/` must name no domain, so the cockpit
# reads this from installed metadata rather than hard-coding a link into a generic framework.
Documentation = "https://mde-pach.github.io/atf/"
Source = "https://github.com/mde-pach/atf"

[project.scripts]
atf = "atf.cli:main"

[dependency-groups]
dev = ["ruff", "ty"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf"]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src/atf"]
[tool.ty.environment]
python-version = "3.11"
[tool.ty.terminal]
error-on-warning = true
[tool.ty.rules]
missing-override-decorator = "error"
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
