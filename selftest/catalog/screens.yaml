# The cockpit in a real browser. Two screens, and not one selector between them: what a scenario
# says about a screen is said in roles and accessible names, inline, where a reader can see it.
#
# `views.yaml` used to live here — five nodes, each carrying a CSS selector, which is a Page Object
# with a catalog file for a class. What it described was the shape of a template; what these
# describe is a place to go and look.

compose:
  resource: screen
  represents: The composer, where a scenario is written.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/compose

groceries_node:
  resource: screen
  represents: The page for a resource that depends on something, where its lineage is said in words.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog/node/lists.groceries
