# What the composer's step picker shows at three moments. Each is a resource with its own name,
# description and place in the catalog — which is the point: "the options once you have typed
# `belongs`" is a thing the suite can talk about, not a sequence buried in a helper.

then_picker_at_rest:
  resource: view
  represents: The Then picker's options before anything is touched — present in the page, shown to nobody.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: "#compose-form .builder-step:last-of-type .combo-list li[role=option]"

then_picker_opened:
  resource: view
  represents: The same options after the picker is focused. Opening it is what makes them visible.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: "#compose-form .builder-step:last-of-type .combo-list li[role=option]:not([hidden])"
    after:
      - { do: click, at: "#compose-form .builder-step:last-of-type .combo-input" }

then_picker_filtered:
  resource: view
  represents: >
    The options left after typing "groceries" in the Then row — that row asks what the assertion
    is about, and exactly one resource in this suite is called that.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: "#compose-form .builder-step:last-of-type .combo-list li[role=option]:not([hidden])"
    after:
      - { do: click, at: "#compose-form .builder-step:last-of-type .combo-input" }
      - { do: type, at: "#compose-form .builder-step:last-of-type .combo-input", text: "groceries" }

catalog_lineage_sentence:
  resource: view
  represents: >
    The lineage said in words on a node page. A two-resource closure is described, not drawn, and
    what a reader actually sees is the test of that.
  depends_on:
    - cockpits.chained
    - pages.groceries_node
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.groceries_node.id}
    selector: "div.card p.small"

then_picker_survivor:
  resource: view
  represents: >
    The one option left after typing "groceries", identified by the value it would submit — which
    is the catalog node the assertion would be about.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: "#compose-form .builder-step:last-of-type .combo-list li[data-value='node:lists.groceries']:not([hidden])"
    after:
      - { do: click, at: "#compose-form .builder-step:last-of-type .combo-input" }
      - { do: type, at: "#compose-form .builder-step:last-of-type .combo-input", text: "groceries" }
