bare:
  resource: workspace
  represents: A suite with nothing declared, so a scenario can vary in exactly one malformation.
  body:
    suite: bare

# `bare` is the smallest *suite*; this is the smallest *directory*. `atf init` is the one command
# with no suite to stand in, so the only honest fixture for it is a directory holding nothing —
# `suites/empty` is one file, `.keep`, because git cannot carry an empty directory. Everything a
# scenario about `init` then observes was written by the command itself.
empty:
  resource: workspace
  represents: A directory with no suite in it — where someone types `atf init` for the first time.
  body:
    suite: empty

chained:
  resource: workspace
  represents: A suite whose catalog declares a two-level dependency chain with a placeholder.
  body:
    suite: chained

ephemeral:
  resource: workspace
  represents: A suite with an ephemeral resource, to prove the plugin tears it down.
  body:
    suite: ephemeral

broken:
  resource: workspace
  represents: A suite whose catalog has a dangling dependency, to prove validation fires at load.
  body:
    suite: broken

failing:
  resource: workspace
  represents: A suite whose spec fails, to prove `atf run` is usable as a deployment guard.
  body:
    suite: failing
