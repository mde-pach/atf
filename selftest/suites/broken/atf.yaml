catalog: ./catalog
specs: ./specs
default_env: local
mutable_envs: [local]

environments:
  local:
    adapters:
      rest:
        base_url_env: SELFTEST_BACKEND
        auth: { header: X-Actor, value_env: SELFTEST_ACTOR }
        pagination: { results_key: results, count_key: count }
  # Deliberately absent from mutable_envs: seeding it must be refused.
  locked:
    adapters:
      rest:
        base_url_env: SELFTEST_BACKEND
        auth: { header: X-Actor, value_env: SELFTEST_ACTOR }
        pagination: { results_key: results, count_key: count }
