{% if not query %}
  <p class="empty">Type to search resources, specs, tests and fixtures.</p>
{% elif not hits %}
  <p class="empty">Nothing matches “{{ query }}”.</p>
{% else %}
  {% for hit in hits %}
    <a href="{{ hit.url }}">
      <span class="chip {{ hit.kind }}">{{ hit.kind }}</span>
      <span>{{ hit.label }}</span>
      <span class="sub">{{ hit.sub }}</span>
    </a>
  {% endfor %}
{% endif %}
