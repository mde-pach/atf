# ATF testing ATF. The resources are suites-under-test and the cockpit's own pages; the systems
# under test are the `atf` CLI and the interface it serves.

catalog: ./catalog
specs: ./specs
default_env: local

adapters:
  - suite_adapters
  - cockpit_adapters

mutable_envs: [local]

# A `@browser` scenario cannot run where the `browser` system is unavailable, and the adapter is
# what knows whether it is. Without this the suite would be red on any checkout that never ran
# `uv sync --group browser`, and a suite that is red for a reason nobody can act on stops being read.
#
# Written with the `@` an author would type on the scenario. It is how a tag is said, not part of
# its name, so the manifest accepts it either way and drops it — and writing it here is what keeps
# that true, now that no unit test asserts it.
requires:
  "@browser": browser

environments:
  local:
    adapters:
      workspace:
        suites: ./suites
      cockpit: {}
      page: {}
      element: {}
      browser: {}
      # The command under test, run by ATF's own adapter. Which copy of ATF it runs, and which
      # manifest it sees, are decided per invocation in `specs/conftest.py` — they are the two
      # things a suite testing a test framework has opinions about.
      command: {}
      # The same backend the suites-under-test provision into, read back through the same generic
      # adapter they use. It is what turns `the backend has 1 owners` — a hand-written assertion
      # about a collection — into `the owner "primary" exists`, which is a claim ATF already makes.
      rest:
        base_url_env: ATF_TESTS_BACKEND
        auth: { header: X-Actor, value_env: ATF_TESTS_ACTOR }
        pagination: { results_key: results, count_key: count }
    clients:
      atf:
        backend_url_env: ATF_TESTS_BACKEND
        actor_env: ATF_TESTS_ACTOR

display:
  systems:
    workspace: { label: Workspace, color: "#7857d8" }
    cockpit: { label: Cockpit, color: "#2f6be0" }
    page: { label: Page, color: "#0f8f6f" }
    element: { label: Element, color: "#b8860b" }
    browser: { label: Browser, color: "#c2410c" }
    rest: { label: Backend, color: "#475569" }
