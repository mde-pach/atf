# A cockpit is a resource: `atf serve` over a workspace, started when a scenario needs it and
# stopped when that scenario ends. Its identity is the URL it came up on.

chained:
  resource: cockpit
  represents: A cockpit serving the two-resource chained suite — the interface under test.
  depends_on:
    - workspaces.chained
  body:
    workspace: ${workspaces.chained.id}

# A second cockpit, over the suite whose catalog holds a resource ATF can never make. It exists so
# that the pages saying *why* an action is not offered have something to say it about — `chained`
# declares nothing of the kind, and a claim about a disabled button needs a reason for it to exist.
unmakeable:
  resource: cockpit
  represents: A cockpit serving a suite with a resource nothing can create.
  depends_on:
    - workspaces.unmakeable
  body:
    workspace: ${workspaces.unmakeable.id}

# A third cockpit, over a suite whose feature carries unanswered questions. `chained` has none, and
# a question written into it would show up in every other scenario that reads its pages.
asked:
  resource: cockpit
  represents: A cockpit serving a suite whose rule has questions nobody has answered.
  depends_on:
    - workspaces.asked
  body:
    workspace: ${workspaces.asked.id}
