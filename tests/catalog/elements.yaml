# What a selector matches on a page. Each one is a resource, so a scenario asserts on it with the
# steps ATF gives every suite — no step code anywhere in this feature.
#
# An element that matches nothing is *absent*, which is what makes `is gone` mean what it says: it
# is how this suite proves a piece of interface was removed and stayed removed.

instances_table:
  resource: element
  represents: The one table on a type page — declared instances, then what only the environment has.
  depends_on:
    - cockpits.chained
    - pages.owner_type
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.owner_type.id}
    selector: table.instances

instance_rows:
  resource: element
  represents: One row per owner the catalog declares. The chained suite declares exactly one.
  depends_on:
    - cockpits.chained
    - pages.owner_type
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.owner_type.id}
    selector: table.instances tbody tr

declared_heading:
  resource: element
  represents: The heading of the list that duplicated the nav and the table. Removed; must stay so.
  depends_on:
    - cockpits.chained
    - pages.owner_type
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.owner_type.id}
    selector: h3.declared-in-the-catalog

lineage_graph:
  resource: element
  represents: The lineage diagram, drawn for a resource that depends on something.
  depends_on:
    - cockpits.chained
    - pages.groceries_node
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.groceries_node.id}
    selector: div.graph

lineage_boxes:
  resource: element
  represents: One box per resource in the closure. groceries hangs off primary, so there are two.
  depends_on:
    - cockpits.chained
    - pages.groceries_node
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.groceries_node.id}
    selector: div.graph a.gnode

standalone_lineage_graph:
  resource: element
  represents: The diagram a resource with no dependencies would get. There is nothing to draw.
  depends_on:
    - cockpits.chained
    - pages.primary_node
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.primary_node.id}
    selector: div.graph

node_payload:
  resource: element
  represents: What ATF would send to create the resource, placeholders and all.
  depends_on:
    - cockpits.chained
    - pages.groceries_node
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.groceries_node.id}
    selector: pre.payload

scenario_gherkin_steps:
  resource: element
  represents: The scenario's steps, rendered as Gherkin. The chained suite's scenario has three.
  depends_on:
    - cockpits.chained
    - pages.scenarios
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.scenarios.id}
    selector: div.gherkin div.step

compose_write_button:
  resource: element
  represents: The composer's one mutating control — an action, so a button and never a badge.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: form#compose-form button.primary

compose_write_chip:
  resource: element
  represents: A create path shaped like a decorative tag. It read as one, so there must never be one.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: form#compose-form span.chip

compose_step_options:
  resource: element
  represents: Every step the composer offers, ATF's own among them.
  depends_on:
    - cockpits.chained
    - pages.compose
  body:
    cockpit: ${cockpits.chained.id}
    page: ${pages.compose.id}
    selector: li[role=option]
