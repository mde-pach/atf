# The cockpit's own pages, declared the way any resource is. Provisioning one starts the server it
# is served by, because that is what it depends on.
#
# A page says where to go and nothing else. What is *on* it is named in the scenario, by role and
# accessible name — see `specs/features/cockpit.feature`.

overview:
  resource: page
  represents: The front page — the one-sentence verdict on whether the suite can ship.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}

catalog:
  resource: page
  represents: The catalog, navigated by resource type.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog

owner_type:
  resource: page
  represents: One resource type — its instances and what the environment holds, in one table.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog/type/owner

groceries_node:
  resource: page
  represents: One resource — what would be sent to create it, and what it hangs off.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog/node/lists.groceries

scenarios:
  resource: page
  represents: Every behaviour the suite describes, and whether it can run here.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/scenarios

compose:
  resource: page
  represents: The composer — where a scenario is written without opening an editor.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/compose

primary_node:
  resource: page
  represents: A resource nothing has to exist before — the case with no lineage to draw.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog/node/owners.primary

scenario_detail:
  resource: page
  represents: One scenario — its Gherkin, what running it would create, and where it is written.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/scenarios/lists::a-list-belongs-to-its-owner

# Two pages that must *not* be there. A path that was retired and an instance nobody declared are
# both 404s, and the reason this suite claims it is that the alternative — quietly rendering an
# empty page — is the failure mode a person cannot see.
retired_path:
  resource: page
  represents: A URL from the interface ATF used to have. Nothing may answer here.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/fixtures

unknown_node:
  resource: page
  represents: An instance nobody declared, asked for by name.
  depends_on:
    - cockpits.chained
  body:
    at: ${cockpits.chained.id}/catalog/node/owners.nope

# The pages of the second cockpit, where a resource ATF cannot make lives.
badge_node:
  resource: page
  represents: A resource ATF never creates — so the page has to say that instead of offering a button.
  depends_on:
    - cockpits.unmakeable
  body:
    at: ${cockpits.unmakeable.id}/catalog/node/badges.missing

badge_type:
  resource: page
  represents: The type page for a resource ATF never creates.
  depends_on:
    - cockpits.unmakeable
  body:
    at: ${cockpits.unmakeable.id}/catalog/type/badge

questions:
  resource: page
  represents: The scenarios page of a suite whose rule has unanswered questions under it.
  depends_on:
    - cockpits.asked
  body:
    at: ${cockpits.asked.id}/scenarios
