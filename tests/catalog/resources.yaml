# The types this suite provisions. A workspace is a real consuming suite on disk; a cockpit is
# `atf serve` running over one; a page is something that cockpit shows.
#
# A page is `mode: data` — an observation, never something ATF makes, which is also what makes it
# safe: nothing here can change the interface it is reading.

workspace:
  system: workspace
  lifecycle: ephemeral      # every scenario gets a pristine one, torn down afterwards
  natural_key: suite

cockpit:
  system: cockpit
  lifecycle: ephemeral      # two scenarios sharing a server would share what the first provisioned
  natural_key: workspace
  id_field: url

# A page is read through ATF's own `html` system, which asks what is on it by role and accessible
# name. There is no selector in this catalog and none in any scenario — `elements.yaml` used to be
# eleven nodes each carrying one, which is a Page Object with a YAML file for a class.
page:
  system: html
  mode: data
  natural_key: at
  id_field: at

# What the suites-under-test leave behind in the stub backend. ATF never creates these — the suite
# being tested does, by seeding or by running — so they are `mode: data`: observations, not
# preconditions. Absent means only "not there yet", which is frequently the very thing a scenario
# is about to claim (`Then the guest "visitor" is gone`). A `reference` node would *block* instead,
# and rightly so, because that mode means "ATF cannot create this and it must already be here".
#
# Declaring them is what lets this suite say `the owner "primary" exists` instead of hand-writing an
# assertion about a collection. Their shape mirrors `suites/*/catalog/resources.yaml`, because it is
# the same records read from the same backend.

owner:
  system: rest
  mode: data
  path: /owners
  natural_key: email

todo_list:
  system: rest
  mode: data
  path: /lists
  natural_key: [owner_id, slug]

guest:
  system: rest
  mode: data
  path: /guests
  natural_key: nickname

# A page is what the server sent. A screen is what is *there* — after the stylesheet applied, htmx
# swapped and a combobox decided what to show. It costs a real browser, so it exists only for the
# claims no amount of reading can make.
#
# Both are ATF's own adapters, and a scenario says the same sentences to either: `the button "Save"
# is showing` is one claim, and which system answers it decides only what it costs.
screen:
  system: browser
  mode: data
  natural_key: at
  id_field: at
