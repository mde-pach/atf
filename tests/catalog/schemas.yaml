# ---- suites carrying an OpenAPI schema --------------------------------------
#
# The schema each import scenario reads, written once and named. These used to be pasted into a
# table cell as one line of JSON — the longest was 391 characters, and the first was pasted four
# times. A cell that nobody can read is a fixture nobody can check.
#
# YAML, not JSON, because `atf import openapi` reads either and this is the one a person can read.

an_account_collection:
  resource: workspace
  represents: A bare suite with an OpenAPI schema beside it — an account collection.
  body:
    suite: bare
    api.yaml: |
      paths:
        /accounts:
          get:
            parameters:
            - name: email
              in: query
          post:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - email
                    - name
                    properties:
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      created_at:
                        type: string
                        format: date-time

projects_under_an_account:
  resource: workspace
  represents: A bare suite with an OpenAPI schema beside it — projects under an account.
  body:
    suite: bare
    api.yaml: |
      paths:
        /accounts/{account_id}/projects:
          get:
            parameters:
            - name: slug
              in: query
          post:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - slug
                    properties:
                      slug:
                        type: string

