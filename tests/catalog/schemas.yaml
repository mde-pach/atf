# The same two collections, in a suite whose catalog already declares one of them — which is what
# lets a scenario show the second import learning from the first correction.
owners_beside_a_catalog:
  resource: workspace
  represents: A suite that already declares an owner keyed on slug, and a schema describing two.
  body:
    suite: bare
    catalog/resources.yaml: |
      owner:
        system: rest
        path: /owners
        natural_key: slug
    api.yaml: |
      paths:
        /owners:
          post:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - name
                    - slug
                    properties:
                      name:
                        type: string
                      slug:
                        type: string
        /accounts:
          post:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - name
                    - slug
                    properties:
                      name:
                        type: string
                      slug:
                        type: string

# The schema named by the manifest rather than passed on the command line.
a_schema_the_manifest_names:
  resource: workspace
  represents: A suite whose manifest points `schemas.api` at a file beside it.
  body:
    suite: bare
    atf.yaml: "{default_env: local, environments: {local: {}}, schemas: {api: {path: ./api.yaml}}}"
    api.yaml: |
      paths:
        /accounts:
          get:
            parameters:
            - name: email
              in: query
          post:
            requestBody:
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - email
                    - name
                    properties:
                      email:
                        type: string
                        format: email
                      name:
                        type: string
                      created_at:
                        type: string
                        format: date-time
