bare:
  resource: workspace
  represents: A suite with nothing declared, so a scenario can vary in exactly one malformation.
  body:
    suite: bare

# `bare` is the smallest *suite*; this is the smallest *directory*. `atf init` is the one command
# with no suite to stand in, so the only honest fixture for it is a directory holding nothing —
# `suites/empty` is one file, `.keep`, because git cannot carry an empty directory. Everything a
# scenario about `init` then observes was written by the command itself.
empty:
  resource: workspace
  represents: A directory with no suite in it — where someone types `atf init` for the first time.
  body:
    suite: empty

chained:
  resource: workspace
  represents: A suite whose catalog declares a two-level dependency chain with a placeholder.
  body:
    suite: chained

ephemeral:
  resource: workspace
  represents: A suite with an ephemeral resource, to prove the plugin tears it down.
  body:
    suite: ephemeral

broken:
  resource: workspace
  represents: A suite whose catalog has a dangling dependency, to prove validation fires at load.
  body:
    suite: broken

failing:
  resource: workspace
  represents: A suite whose spec fails, to prove `atf run` is usable as a deployment guard.
  body:
    suite: failing

# A suite whose seeding fails at *provision* time rather than at load: `broken` is refused before
# anything is touched, and this one gets partway. That difference is what `--keep-going` and the
# blocked-dependent report are about, and nothing else in the templates reaches it.
unmakeable:
  resource: workspace
  represents: A suite holding one resource ATF can never make, and one that depends on it.
  body:
    suite: unmakeable

# The chained suite with one feature rewritten to carry `# ?` questions under its rule. A workspace
# varies by file, so this needs no template of its own — and the feature is written as a block
# rather than with `\n` escapes, because a feature file that a reader can read is the point.
asked:
  resource: workspace
  represents: A suite whose rule has questions nobody could answer written under it.
  body:
    suite: chained
    specs/steps/test_lists.py: "#absent"
    specs/features/lists.feature: |
      Feature: Paying
        Money moves once, and only once.

        Rule: A card is charged once per basket

          # ? What happens if the card is declined after the basket was emptied?
          # ? Who owns the refund when a partial capture times out?

          Scenario: A basket is paid for
            Given the owner "primary"
