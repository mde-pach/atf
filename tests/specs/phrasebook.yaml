# The one place this suite's technical vocabulary lives.
#
# Everything below is a sentence a reader can check against what ATF promises, standing for claims
# ATF can decide. Nothing here performs anything: each line is a step that already existed, said
# in words that mean something outside the framework.
#
# Rename `mutable_envs`, or change which exit code a refusal uses, and this file is the only place
# that has to know.

'the command succeeds':
  - the result field "exit_code" is "0"

# What "it failed" means is the adapter's answer, not this suite's: `ok` is one field whatever the
# command was, so no scenario here has to know which exit code stands for what.
'the command failed':
  - the result field "ok" is "false"

'the output mentions "{words}"':
  - the result field "output" contains "{words}"

'it is refused because "{reason}"':
  - the result field "exit_code" is "2"
  - the result field "output" contains "{reason}"

# A refusal usually has more than one thing to say — every problem in a catalog at once, or the
# variable that is missing *and* the setting that wanted it. The first is the reason; the rest are
# said with this, so a scenario never has to write `it is refused because` twice about one refusal.
'the refusal also mentions "{detail}"':
  - the result field "output" contains "{detail}"

# The full manifest path of the setting whose value was missing. Spelling it in the feature would
# put a nested config key into a sentence, which is the vocabulary this file exists to absorb.
'the refusal names the setting that wanted it':
  - the result field "output" contains "environments.local.adapters.rest.base_url_env"

'it lists the owner and the list that depends on it':
  - the result field "output" contains "owners.primary"
  - the result field "output" contains "lists.groceries"

# Which environment a run reports having used. Parameterised, because the whole point of one
# scenario below is that it is *not* the one the manifest calls its default.
'the run used the environment "{env}"':
  - the result field "output" contains "in {env}"

'the run fails':
  - the result field "exit_code" is "1"
  - the result field "output" contains "failed"

'nothing was created':
  - the environment has 0 owner
  - the environment has 0 todo_list

# One scenario runs the same command against two environments and keeps both outcomes, so these
# two say which of them they are about. That is what naming a slot buys — with one, only the
# second could ever be asserted on.
'seeding the locked environment was refused':
  - the locked_env field "exit_code" is "2"

'seeding the open environment worked':
  - the open_env field "exit_code" is "0"

# ---- saying what a flag does, without writing one ---------------------------
#
# `atf lint` reads feature files and not this one, which is exactly the seam that makes these legal:
# a flag is how the command is spelled, and what it *means* is what a scenario should say. Rename a
# flag and this is the only file that changes.

'the developer seeds only the {type} "{name}"':
  - I run "atf seed local --type {type} --name {name}"

'the developer seeds everything it can rather than stopping at the first failure':
  - I run "atf seed local --keep-going"

# What a person exported, rather than what they typed. The variable's name is ATF's word, not a
# reader's, so it lives here.
'the developer runs the specs against the environment they exported, "{env}"':
  - I run "atf run" with ATF_ENV exported as "{env}"

# ---- what `atf init` says ---------------------------------------------------

'the output says a suite was scaffolded':
  - the result field "output" contains "Scaffolded"

'the output says the directory already holds one':
  - the result field "output" contains "already contains a suite"

# What a scaffolded suite needs before it will run: an actor to send, and nothing else — with no
# backend URL exported it starts the stand-in one it ships with. Exported here rather than left to
# whatever the machine happens to have, because a scenario that passes only on some machines is
# not a claim about ATF.
'the developer runs the scaffolded suite':
  - I run "atf run" with ATF_ACTOR exported as "scaffold"

'the scaffolded suite passes':
  - the result field "output" contains "2 passed"

# ---- what `atf docs` writes --------------------------------------------------
#
# The pages land under a path, and a path is exactly what a feature file must not carry. So the
# scenarios say *which* page they are reading and this file knows where it is — and a page is read
# by printing it, which is the only reading surface a suite driving a command line has.

'the developer reads the page written for that feature':
  - I run "cat docs/specs/features/a.md"

'the developer reads the page written for the lists feature':
  - I run "cat docs/specs/features/lists.md"

# Whatever was last printed, claimed about as prose. `output` is the command's word; a page is what
# a reader thinks they are looking at.
'the page mentions "{words}"':
  - the result field "output" contains "{words}"

# The verdict a page carries under one scenario's own heading, which is written on a line of its
# own — not the count in the summary above it, which would be true whatever that scenario did.
'the page says that scenario is passing':
  - the result field "output" contains "*passing*"

'it says it wrote an index beside the pages':
  - the result field "output" contains "index.md"

'it says how the suite last did':
  - the result field "output" contains "1 passing"

'it says nothing has run there yet':
  - the result field "output" contains "Nothing has run against local yet"

'it says there is nothing to write':
  - the result field "output" contains "nothing to write"

# Where the pages go, and which environment's history the verdicts come from. Both are flags, so
# both are said here rather than in a sentence.
'the developer writes the pages somewhere else':
  - I run "atf docs --out handbook"

'the developer reads the index from there':
  - I run "cat handbook/index.md"

'the developer asks for the documentation of an environment nobody configured':
  - I run "atf docs --env nowhere"

# ---- what `atf status` says --------------------------------------------------

# Status names the environment it looked in, which is the only way a scenario can tell *which* of
# two environments a command chose.
'it says it looked in "{env}"':
  - the result field "output" contains "present in {env}"

'it says the resource is one this environment cannot reach':
  - the result field "output" contains "unsupported"
  - the result field "output" contains "no adapter for system"

# The full manifest path of the client setting whose value was missing — a nested config key, which
# is exactly the vocabulary a feature file should not be carrying.
'the refusal names the client that wanted it':
  - the result field "output" contains "environments.local.clients.api.auth.value_env"

# ---- seeding, and what it says when part of a catalog cannot be made --------

'the developer seeds an instance without saying its type':
  - I run "atf seed local --name primary"

# The refusal quotes the two flags back, which is right for a command-line message and wrong for a
# feature file — so the sentence says what went wrong and this says how the command spells it.
'it is refused for not saying what kind of thing that is':
  - the result field "exit_code" is "2"
  - the result field "output" contains "--name needs --type"

'it stopped at the first failure':
  - the result field "output" contains "Stopped at the first failure"

'it did not stop at the first failure':
  - the result field "output" does not contain "Stopped at the first failure"

# The flag that shows every independent failure instead of the first. Named here and not in a
# feature file, which is the whole point of this file.
'it says how to attempt the rest':
  - the result field "output" contains "--keep-going"

'the borrowed badge could not be found':
  - the result field "output" contains "FAIL"
  - the result field "output" contains "badges.missing"

'the label was skipped because of the badge':
  - the result field "output" contains "skip"
  - the result field "output" contains "depends on badges.missing"

# ---- what `atf status` lists ------------------------------------------------

'it says nothing is there yet':
  - the result field "output" contains "absent"

'it says the guest is built for each run rather than found':
  - the result field "output" contains "ephemeral"
  - the result field "output" contains "built per run"

'it tallies how many of them are there':
  - the result field "output" contains "0/2 present in local (1 built per run)"

'nothing that depended on the label was attempted either':
  - the result field "output" contains "depends on labels.hero"

'the owner was still made':
  - the result field "output" contains "owners.primary"
  - the owner "primary" exists

# What a run leaves behind: the resources the catalog calls persistent, and none of the ones it
# calls ephemeral.
'the guest it built is gone and the owner it needed is not':
  - the environment has 0 guest
  - the owner "primary" exists
  - the todo_list "groceries" exists

# ---- what a scenario that had one to itself leaves behind --------------------
#
# An isolated instance is deleted with the scenario that asked for it, so what is left in the
# backend afterwards is the whole of the evidence: the shared resources, and none of the copies.

'the list it made is gone and the owner it hung off is not':
  - the environment has 0 todo_list
  - the owner "primary" exists

'the shared list is the only one left':
  - the environment has 1 todo_list
  - the todo_list "groceries" exists

'the owner it made is gone and the seeded one is not':
  - the environment has 1 owner
  - the owner "primary" exists

# ---- what a copy nobody could make is refused with ---------------------------
#
# Three refusals, quoted back as the sentence a reader gets. The wordings are ATF's own — a
# lifecycle, a mode, and the shape of a natural key — which is exactly the vocabulary this file
# exists to keep out of a feature.

'it says this one is built for each run already':
  - the result field "output" contains "built fresh for every run"

'it says this one is never made here':
  - the result field "output" contains "ATF never creates them"

'it says to ask for it the ordinary way':
  - the result field "output" contains "which is how this one is asked for"

'it says nothing would tell the copy from the shared one':
  - the result field "output" contains "is either a link to another resource or not text"

'it says how to say what makes the copy different':
  - the result field "output" contains "say what makes this one different"

# ---- what a spec written wrongly says ---------------------------------------

'the run says the catalog declares no such type':
  - the result field "output" contains "no resource type 'acount'"

'the run names the resource nobody has provided':
  - the result field "output" contains "badges.imported"

'both rows ran':
  - the result field "output" contains "2 passed"

'the badge it hung off survives':
  - the environment has 0 guest
  - the environment has 1 todo_list

# ---- what the cockpit sends -------------------------------------------------
#
# These read the HTML a page *sent*, which costs no browser — so most of this suite still runs on a
# checkout that never installed one. Most of what there is to say about a page is now said in the
# feature itself, by role and accessible name; what is left here is the handful of lines that would
# otherwise put a status code or a placeholder's spelling into a sentence.

'the page "{name}" was served':
  - the page "{name}" field "status" is "200"

'the page "{name}" is titled "{title}"':
  - the page "{name}" field "title" is "{title}"

# Nothing answers here — which is a claim about a status code, and therefore lives in this file.
'the page "{name}" was not found':
  - the page "{name}" field "status" is "404"

# The reference as it is written in the catalog, left unresolved because that is the whole point of
# showing a payload. Spelling `${...}` in a feature would put ATF's own syntax into a sentence.
'the payload shows the reference rather than a value':
  - the words "owners.primary.id" are showing

# What makes a rendering *Gherkin* rather than a list is that the keyword and the line survive it.
'its steps read as the lines they were written as':
  - the words "Given" are showing
  - the words "the todo_list" are showing

# One of ATF's own steps, offered beside the suite's. Naming the pattern here rather than in the
# feature is the same trade every line in this file makes.
'the steps ATF gives every suite are offered':
  - the words "I list every" are showing

# ---- what `atf lint` says ---------------------------------------------------

'the specs say nothing only the layer below should know':
  - the result field "exit_code" is "0"
  - the result field "output" contains "No technical vocabulary"

'it objects, naming the rule "{rule}"':
  - the result field "exit_code" is "1"
  - the result field "output" contains "{rule}"

'it says how to answer the objection':
  - the result field "output" contains "Write a phrase for it"
  - the result field "output" contains "atf-lint: ignore"

# ---- what a run collected ---------------------------------------------------

'both its scenarios ran':
  - the result field "output" contains "2 passed"

'the scenario ran once, not twice':
  - the result field "output" contains "1 passed"
  - the result field "output" does not contain "2 passed"

'the run says no step is worded that way':
  - the result field "output" contains "Step definition is not found"

'the run names it "{nodeid}"':
  - the result field "output" contains "{nodeid}"

# ---- generated values -------------------------------------------------------

'the refusal names the variable nobody exported':
  - the result field "output" contains "ATF_TESTS_NOT_EXPORTED is not set"

# The message shows the form it wanted, which is the only useful thing to say about an offset
# nobody can read.
'it refuses the offset, showing the form it wanted':
  - the result field "exit_code" is "1"
  - the result field "output" contains "expected `now+1d 09:00`"

'it says which providers there are':
  - the result field "output" contains "registered: env, fake, now, uuid"

# ---- what a claim says when it does not hold --------------------------------
#
# A claim is only worth as much as the sentence it produces when it fails. Each of these is the
# message a reader actually gets, quoted back.

'it says nothing in the environment matches':
  - the result field "output" contains "nothing in local matches owners.primary"
  - the result field "output" contains "email="

'it says the resource is still there':
  - the result field "output" contains "is still in local"

# A claim's value is captured between double quotes, so it can never itself contain one — the
# message says `is "standard", not "enterprise"` and this names the parts around them.
'it says what the field holds instead':
  - the result field "output" contains "owner 'primary' field 'plan' is"
  - the result field "output" contains ", not"

'it lists the fields the record does carry':
  - the result field "output" contains "has no field 'tier'"
  - the result field "output" contains "the record carries"

'it lists the types the catalog does declare':
  - the result field "output" contains "no resource type 'acount' in the catalog"
  - the result field "output" contains "known types:"

'it lists the instances of that type':
  - the result field "output" contains "the catalog declares no owner called 'primry'"
  - the result field "output" contains "it declares: primary"

'it says an ephemeral resource is never looked up':
  - the result field "output" contains "is ephemeral, so ATF never looks one up"

'it says a field claim needs one record':
  - the result field "output" contains "a field assertion needs one"

'it says what the scenario is holding instead':
  - the result field "output" contains "nothing has put 'reslt' on the context"
  - the result field "output" contains "It holds:"

'it lists every field that disagrees':
  - the result field "output" contains "is not the shape this scenario says"

# ---- what a CI report brings back -------------------------------------------

'it reports what CI saw':
  - the result field "output" contains "Imported 2 results into local"
  - the result field "output" contains "1 passed, 1 failed"

'it keeps the run where the cockpit will find it':
  - the result field "output" contains "Stored as run"
  - the result field "output" contains ".atf/runs"

'it refuses what is not a report':
  - the result field "exit_code" is "2"
  - the result field "output" contains "no test results"

# ---- choosing what to run ---------------------------------------------------
#
# Every flag `atf run` takes, named here rather than in a feature: what a scenario means is *which
# scenarios ran*, and how the command spells that choice is exactly the vocabulary this file absorbs.

'the developer runs only the scenarios worded "{words}"':
  - I run "atf run -k '{words}'"

'the developer runs only what is tagged "{tag}"':
  - I run "atf run --tag {tag}"

'the developer runs what failed last time':
  - I run "atf run --failed"

'the developer runs the specs, writing a report for CI':
  - I run "atf run --json ci-report.json"

'the run says what it looked for and did not find':
  - the result field "exit_code" is "1"
  - the result field "output" contains "Nothing matched"

'the run says which of them it is running again':
  - the result field "output" contains "did not pass last time"

'it says nothing failed':
  - the result field "output" contains "Nothing failed in the last run"

# The format a CI gate reads. Naming it in a feature would put an acronym where a sentence belongs.
'it says where it wrote the report':
  - the result field "output" contains "Wrote a CTRF report to"
