catalog: ./catalog
specs: ./specs
default_env: local
mutable_envs: [local]

environments:
  local:
    adapters:
      rest:
        base_url: http://127.0.0.1:8765
        auth: { header: X-Actor, value: atf-tests }
        pagination: { results_key: results, count_key: count }
  # Deliberately absent from mutable_envs: seeding it must be refused.
  locked:
    adapters:
      rest:
        base_url: http://127.0.0.1:8765
        auth: { header: X-Actor, value: atf-tests }
        pagination: { results_key: results, count_key: count }
