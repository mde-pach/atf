# A suite with one resource ATF cannot make. `badge` is `mode: reference`: a precondition ATF never
# creates, and nothing in the environment satisfies it — so seeding *fails* here rather than being
# refused at load, which is the only way to reach `--keep-going` and the blocked-dependent path.

owner:
  system: rest
  path: /owners
  natural_key: email

badge:
  system: rest
  mode: reference
  path: /guests
  natural_key: nickname

label:
  system: rest
  path: /lists
  natural_key: [owner_id, slug]
